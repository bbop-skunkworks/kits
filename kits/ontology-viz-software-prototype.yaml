# Ontology visualization software prototype (a STARTING DRAFT).
# Building interactive prototypes over OBO ontologies (GO and beyond).
# The domain content here is for the ontology folks to curate; the format
# and the grounded API/verification notes are the worked example.
# See the repo README for the field reference.

name: ontology-viz-software-prototype
title: "Ontology visualization software prototype"
description: "Reusable context + resources for building interactive prototypes for (OBO) ontologies."
maintainers: ["@kltm"]

applies_to:
  profile: [developer]
  deliverable: [interactive_app, interactive_report]
  topics:
    - "OBO"
    - "ontology"
    - "term browser"
    - "term"
    - "history"

context: |
  An ontology is a structured, controlled vocabulary of terms describing
  biology, organized as a directed graph — often acyclic (a DAG); terms
  relate via relationships (which may themselves be ontology terms).
  Terms carry stable identifiers like GO:0008150, a
  name, a definition, and a namespace. Ontologies are distributed in
  OBO and OWL formats and served by several public APIs (below).  A
  "term browser" or similar prototype typically lets a user
  search/select a term and explore its neighborhood in the graph.

skills:
  # GROUNDED, load-bearing (this is the build agent's own hard-won rule):
  - "VERIFY the exact response shape of any API against a real example value
     with fetch_url BEFORE writing code against it. The training set is full of
     plausible-but-fictional GO endpoints — bbop#49 shipped a broken app because
     it assumed a QuickGO `.../terms/{id}/history` endpoint that does not exist.
     If the data you want isn't exposed, work with what IS (and say so in answer.md)."
  # DRAFT — curate with the GO experts:
  - "(curate) Preferred way to load/slice ontology data for a static prototype."

libraries:
  - oaklib

resources:
  # Public GO APIs the build agent already knows to consider (grounded):
  - url: "https://www.ebi.ac.uk/ols4/"
    note: "OLS (Ontology Lookup Service) — generic OBO/ontology term + hierarchy API."

run_hints:                             # suggestions the agent MAY override
  stack: "Prefer a dependency-light prototype (a static ontology data slice + vanilla JS or a small framework) deployable to GitHub Pages; no server needed."
  output_target: "A single interactive page on Pages (the run's docs/runs/.../index.html)."
  keep_in_mind: "Render ontology graphs honestly; don't fake a strict tree. Cite the data source + its fetch date."
