name: validate-kits

# Validate every kit under kits/ against the kit contract (kit.schema.json,
# generated from the LinkML `Kit` class in bbop-skunkworks/operations) on push +
# PR, so a malformed kit can't reach the spawn flow.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml jsonschema
      - name: Validate all kits
        run: python validate.py
